# XcodeGen project spec for the MoniVitals iOS app.
#
# Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate && open MoniVitals.xcodeproj
#
# This mirrors the web app (web/) and shares the algorithm/protocol specs in docs/.
# NOT a medical device — research / educational tool only.

name: MoniVitals
options:
  bundleIdPrefix: com.monivitals
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MoniVitals:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MoniVitals
    info:
      path: MoniVitals/Resources/Info.plist
      properties:
        CFBundleDisplayName: MoniVitals
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monivitals.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  MoniVitalsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MoniVitalsTests
    dependencies:
      - target: MoniVitals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monivitals.app.tests
        GENERATE_INFOPLIST_FILE: YES

  MoniVitalsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MoniVitalsUITests
    dependencies:
      - target: MoniVitals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monivitals.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoniVitals

schemes:
  MoniVitals:
    build:
      targets:
        MoniVitals: all
        MoniVitalsTests: [test]
        MoniVitalsUITests: [test]
    test:
      targets:
        - MoniVitalsTests
        - MoniVitalsUITests
      gatherCoverageData: true
