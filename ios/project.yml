# XcodeGen project spec for the VitalView iOS app.
#
# Generate the Xcode project with:
#   brew install xcodegen
#   cd ios && xcodegen generate && open VitalView.xcodeproj
#
# This mirrors the web app (web/) and shares the algorithm/protocol specs in docs/.
# NOT a medical device — research / educational tool only.

name: VitalView
options:
  bundleIdPrefix: com.vitalview
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  VitalView:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VitalView
    info:
      path: VitalView/Resources/Info.plist
      properties:
        CFBundleDisplayName: VitalView
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: true
        # Research-tool rationale; CoreBluetooth requires this key to scan/connect.
        NSBluetoothAlwaysUsageDescription: >-
          VitalView connects to a research biosignal wearable over Bluetooth to
          display and record ECG, PPG, and bioimpedance for an educational
          validation study. It is not a medical device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalview.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  VitalViewTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VitalViewTests
    dependencies:
      - target: VitalView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalview.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VitalView:
    build:
      targets:
        VitalView: all
        VitalViewTests: [test]
    test:
      targets:
        - VitalViewTests
      gatherCoverageData: true
